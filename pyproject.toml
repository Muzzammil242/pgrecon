[project]
name = "pgrecon"
version = "0.1.3"
description = "Migration reconnaissance for PostgreSQL: inventory and assess Oracle databases before the move."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Muzzammil Sarwar", email = "muzzammil@umaish.com" },
]
keywords = ["postgresql", "oracle", "migration", "assessment", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "sqlglot>=25.0",
    "antlr4-python3-runtime>=4.13.2,<4.14",
]

[project.scripts]
pgrecon = "pgrecon.cli:app"

[project.urls]
Repository = "https://github.com/Muzzammil242/pgrecon"
Issues = "https://github.com/Muzzammil242/pgrecon/issues"
Changelog = "https://github.com/Muzzammil242/pgrecon/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgrecon"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/pgrecon/plsql/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"
exclude = ["src/pgrecon/plsql/_generated/"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "antlr4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pgrecon.plsql._generated.*"
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pgrecon"]
omit = ["src/pgrecon/plsql/_generated/*"]
