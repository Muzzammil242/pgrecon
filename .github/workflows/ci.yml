name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: ASCII policy
        run: uv run python tools/check_ascii.py

      - name: Import boundaries
        run: uv run python tools/check_boundaries.py

      - name: Commit message style
        run: uv run python tools/check_commit.py --head

      - name: Tests
        run: uv run pytest --cov --cov-fail-under=85

  live-apply:
    # The claim on the tin: the bundled sample's conversion applies to
    # a real PostgreSQL 16 with zero rejected statements, on every
    # commit - not just on the author's bench.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Convert the bundled sample
        run: |
          uv run pgrecon load examples/dump_oracle21c --db sample.db
          uv run pgrecon report --db sample.db > /dev/null
          uv run pgrecon convert --db sample.db --out schema_pg.sql --residue residue.txt

      - name: Apply to live PostgreSQL 16
        env:
          PGPASSWORD: ci
        run: |
          psql -h 127.0.0.1 -U postgres -qX -v ON_ERROR_STOP=1 \
            -c "SET check_function_bodies = on" -f schema_pg.sql
          echo "applied with zero rejected statements"

      - name: Residue file is present and carries reasons
        run: |
          test -s residue.txt
          grep -q "declined to convert" residue.txt
